<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="default.css" media="all" />
    <title>Toastr</title>
  </head>
  <body>
    <div id="sidebar">
      <div id="debugger">
        <form autocomplete="on">
          <label for="privkey">Private Key:</label><input name="privkey" /><br />
          <label for="url">URL:</label><input name="url" /><br />
          <label for="relays">Relays:</label><input name="relays" /><br />
          <label for="cache">Use Cache:</label><input name="cache" type="checkbox" />
        </form>
      </div>
    </div>

    <div class="toastr-container">
      <div class="toasts">
      </div>

      <div class="toast-new">
        <header>
          <img class="avatar" src="133.png" />
          <form action="" method="POST" class="toast-new-form" autocomplete="off">
            <input type="hidden" name="domain" value="" />
            <input type="hidden" name="url" value="" />
            <input type="hidden" name="username" value="Eevee" />
            <input type="hidden" name="avatar_url" value="133.png" />
            <input type="hidden" name="likes" value="0" />
            <input type="hidden" name="zaps" value="0" />
            <input type="hidden" name="replies" value="0" />
            <input type="hidden" name="reposts" value="0" />

            <textarea type="text" name="message" placeholder="Write a comment..."></textarea>
            <button type="submit">Comment</button>
          </form>
        </header>
      </div>
    </div>
    <script src="nostr.bundle.js"></script>
    <script src="sql-wasm.js"></script>
    <script src="script.js"></script>
  </body>
</html>
