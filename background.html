<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="frontend/default.css" media="all" />
    <title>Toastr</title>
    <script src="frontend/nostr.bundle.js"></script>
    <script src="frontend/sql-wasm.js"></script>
    <script src="frontend/background-toast.js"></script>
  </head>
  <body>
    <div id="debugger">
      <form autocomplete="on">
        Private Key: <input name="privkey" /><br />
        URL: <input name="url" /><br />
        Relays: <input name="relays" /><br />
        Use Cache: <input name="cache" type="checkbox" />
      </form>
    </div>

    <div class="toastr-container">
      <div class="toasts">
      </div>

      <div class="toast-new">
        <header>
          <img class="avatar" src="frontend/133.png" />
          <form action="" method="POST" class="toast-new-form" autocomplete="off">
            <input type="hidden" name="domain" value="" />
            <input type="hidden" name="url" value="" />
            <input type="hidden" name="username" value="Eevee" />
            <input type="hidden" name="avatar_url" value="133.png" />
            <input type="hidden" name="likes" value="0" />
            <input type="hidden" name="zaps" value="0" />
            <input type="hidden" name="replies" value="0" />
            <input type="hidden" name="reposts" value="0" />

            <textarea type="text" name="message" placeholder="Write a comment..."></textarea>
            <button type="submit">Comment</button>
          </form>
        </header>
      </div>
    </div>

    <script src="frontend/script.js"></script>
  </body>
</html>
